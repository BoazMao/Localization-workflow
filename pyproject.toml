[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "localization-workflow"
version = "0.1.0"
description = "Native desktop workflow for AI-assisted video transcription and translation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Boaz Mao" }]
dependencies = [
  "alembic>=1.14,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.gui-scripts]
localization-workflow = "localization_workflow.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localization_workflow"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.coverage.run]
source = ["localization_workflow"]
branch = true
